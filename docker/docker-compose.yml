####################################
# 🦎 KOMODO DOCKER COMPOSE 🦎 #
####################################

## This compose file deploys:
##   1. Komodo Client (Agent) - CLI tool
##   2. Komodo Server (Periphery) - Agent server
##
## Both services can be configured via environment variables
## or by mounting configuration files to /config
##
## Quick Start:
##   1. Copy env.example to .env: cp env.example .env
##   2. Edit .env with your configuration
##   3. Run: docker-compose up -d

version: '3.8'

services:
  ####################
  # KOMODO CLIENT (AGENT) #
  ####################
  komodo-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    image: komodo-client:latest
    container_name: komodo-client
    restart: unless-stopped
    init: true
    
    ## Environment variables for Client configuration
    ## Full variable list: https://github.com/moghtech/komodo/blob/main/config/komodo.cli.toml
    environment:
      ## Configuration paths - can be files or directories
      ## Default: /config
      - KOMODO_CLI_CONFIG_PATHS=${KOMODO_CLI_CONFIG_PATHS:-/config}
      
      ## Configuration keywords for matching files in directories
      ## Default: *config.*,*komodo.cli*.*
      - KOMODO_CLI_CONFIG_KEYWORDS=${KOMODO_CLI_CONFIG_KEYWORDS:-*config.*,*komodo.cli*.*}
      
      ## Default profile to use
      - KOMODO_CLI_DEFAULT_PROFILE=${KOMODO_CLI_DEFAULT_PROFILE:-Default}
      
      ## Host address of Komodo Core
      - KOMODO_CLI_HOST=${KOMODO_CLI_HOST:-${KOMODO_HOST:-https://komodo.example.com}}
      
      ## API Key for authentication
      - KOMODO_CLI_KEY=${KOMODO_CLI_KEY:-}
      
      ## API Secret for authentication
      - KOMODO_CLI_SECRET=${KOMODO_CLI_SECRET:-}
      
      ## Backups folder
      - KOMODO_CLI_BACKUPS_FOLDER=${KOMODO_CLI_BACKUPS_FOLDER:-/backups}
      
      ## Maximum number of backups to keep
      - KOMODO_CLI_MAX_BACKUPS=${KOMODO_CLI_MAX_BACKUPS:-14}
      
      ## Database configuration (source)
      - KOMODO_DATABASE_URI=${KOMODO_DATABASE_URI:-}
      - KOMODO_DATABASE_ADDRESS=${KOMODO_DATABASE_ADDRESS:-localhost:27017}
      - KOMODO_DATABASE_USERNAME=${KOMODO_DATABASE_USERNAME:-}
      - KOMODO_DATABASE_PASSWORD=${KOMODO_DATABASE_PASSWORD:-}
      - KOMODO_DATABASE_DB_NAME=${KOMODO_DATABASE_DB_NAME:-komodo}
      
      ## Database configuration (target)
      - KOMODO_CLI_DATABASE_TARGET_URI=${KOMODO_CLI_DATABASE_TARGET_URI:-}
      - KOMODO_CLI_DATABASE_TARGET_ADDRESS=${KOMODO_CLI_DATABASE_TARGET_ADDRESS:-localhost:27017}
      - KOMODO_CLI_DATABASE_TARGET_USERNAME=${KOMODO_CLI_DATABASE_TARGET_USERNAME:-}
      - KOMODO_CLI_DATABASE_TARGET_PASSWORD=${KOMODO_CLI_DATABASE_TARGET_PASSWORD:-}
      - KOMODO_CLI_DATABASE_TARGET_DB_NAME=${KOMODO_CLI_DATABASE_TARGET_DB_NAME:-komodo}
      
      ## Logging
      - KOMODO_CLI_LOGGING_LEVEL=${KOMODO_CLI_LOGGING_LEVEL:-info}
      - KOMODO_CLI_LOGGING_STDIO=${KOMODO_CLI_LOGGING_STDIO:-standard}
      - KOMODO_CLI_LOGGING_PRETTY=${KOMODO_CLI_LOGGING_PRETTY:-false}
      
      ## Timezone
      - TZ=${TZ:-Etc/UTC}
    
    volumes:
      ## Mount configuration directory
      ## Place komodo.cli.toml files here
      - client-config:/config
      
      ## Mount backups directory
      - client-backups:/backups
      
      ## Mount workspace directory (optional)
      ## This is where the CLI will operate from
      - ${CLIENT_WORKSPACE:-./workspace}:/workspace
    
    networks:
      - komodo-network
    
    ## Uncomment to run specific commands
    # command: ["backup", "database"]
    # command: ["restore", "database"]
    
    ## Health check (optional)
    # healthcheck:
    #   test: ["CMD", "km", "--version"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  ####################
  # KOMODO SERVER (PERIPHERY) #
  ####################
  komodo-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: komodo-server:latest
    container_name: komodo-server
    restart: unless-stopped
    init: true
    
    ## Environment variables for Server configuration
    ## Full variable list: https://github.com/moghtech/komodo/blob/main/config/periphery.config.toml
    environment:
      ## Configuration paths
      - PERIPHERY_CONFIG_PATHS=${PERIPHERY_CONFIG_PATHS:-/config}
      
      ## Root directory for Periphery operations
      ## All compose files and repos must be inside this directory
      - PERIPHERY_ROOT_DIRECTORY=${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
      
      ## Override specific directories (optional)
      - PERIPHERY_REPO_DIR=${PERIPHERY_REPO_DIR:-}
      - PERIPHERY_STACK_DIR=${PERIPHERY_STACK_DIR:-}
      - PERIPHERY_BUILD_DIR=${PERIPHERY_BUILD_DIR:-}
      
      ## Authentication - Private key
      - PERIPHERY_PRIVATE_KEY=${PERIPHERY_PRIVATE_KEY:-file:/config/keys/periphery.key}
      
      ## Authentication - Core public keys
      - PERIPHERY_CORE_PUBLIC_KEYS=${PERIPHERY_CORE_PUBLIC_KEYS:-file:/config/keys/core.pub}
      
      ## Outbound mode - Connect to Core
      - PERIPHERY_CORE_ADDRESS=${PERIPHERY_CORE_ADDRESS:-}
      - PERIPHERY_CONNECT_AS=${PERIPHERY_CONNECT_AS:-}
      - PERIPHERY_ONBOARDING_KEY=${PERIPHERY_ONBOARDING_KEY:-}
      
      ## Inbound mode - Server settings
      - PERIPHERY_SERVER_ENABLED=${PERIPHERY_SERVER_ENABLED:-}
      - PERIPHERY_PORT=${PERIPHERY_PORT:-8120}
      - PERIPHERY_BIND_IP=${PERIPHERY_BIND_IP:-[::]}
      - PERIPHERY_ALLOWED_IPS=${PERIPHERY_ALLOWED_IPS:-}
      
      ## SSL/TLS Configuration
      - PERIPHERY_SSL_ENABLED=${PERIPHERY_SSL_ENABLED:-true}
      - PERIPHERY_SSL_KEY_FILE=${PERIPHERY_SSL_KEY_FILE:-/config/ssl/key.pem}
      - PERIPHERY_SSL_CERT_FILE=${PERIPHERY_SSL_CERT_FILE:-/config/ssl/cert.pem}
      
      ## Terminal settings
      - PERIPHERY_DEFAULT_TERMINAL_COMMAND=${PERIPHERY_DEFAULT_TERMINAL_COMMAND:-bash}
      - PERIPHERY_DISABLE_TERMINALS=${PERIPHERY_DISABLE_TERMINALS:-false}
      - PERIPHERY_DISABLE_CONTAINER_TERMINALS=${PERIPHERY_DISABLE_CONTAINER_TERMINALS:-false}
      
      ## Polling intervals
      - PERIPHERY_STATS_POLLING_RATE=${PERIPHERY_STATS_POLLING_RATE:-5-sec}
      - PERIPHERY_CONTAINER_STATS_POLLING_RATE=${PERIPHERY_CONTAINER_STATS_POLLING_RATE:-30-sec}
      
      ## Docker Compose CLI
      - PERIPHERY_LEGACY_COMPOSE_CLI=${PERIPHERY_LEGACY_COMPOSE_CLI:-false}
      
      ## Disk mount filtering
      - PERIPHERY_INCLUDE_DISK_MOUNTS=${PERIPHERY_INCLUDE_DISK_MOUNTS:-/etc/hostname}
      - PERIPHERY_EXCLUDE_DISK_MOUNTS=${PERIPHERY_EXCLUDE_DISK_MOUNTS:-}
      
      ## Logging
      - PERIPHERY_LOGGING_LEVEL=${PERIPHERY_LOGGING_LEVEL:-info}
      - PERIPHERY_LOGGING_STDIO=${PERIPHERY_LOGGING_STDIO:-standard}
      - PERIPHERY_LOGGING_PRETTY=${PERIPHERY_LOGGING_PRETTY:-false}
      - PERIPHERY_PRETTY_STARTUP_CONFIG=${PERIPHERY_PRETTY_STARTUP_CONFIG:-false}
      - PERIPHERY_LOGGING_OTLP_ENDPOINT=${PERIPHERY_LOGGING_OTLP_ENDPOINT:-}
      - PERIPHERY_LOGGING_OPENTELEMETRY_SERVICE_NAME=${PERIPHERY_LOGGING_OPENTELEMETRY_SERVICE_NAME:-Periphery}
      - PERIPHERY_LOGGING_OPENTELEMETRY_SCOPE_NAME=${PERIPHERY_LOGGING_OPENTELEMETRY_SCOPE_NAME:-Komodo}
      
      ## Timezone
      - TZ=${TZ:-Etc/UTC}
    
    ports:
      ## Expose Periphery port
      ## Format: "HOST_PORT:CONTAINER_PORT"
      - "${PERIPHERY_HOST_PORT:-8120}:8120"
    
    volumes:
      ## Mount configuration directory
      ## Place periphery.config.toml files here
      - server-config:/config
      
      ## Mount keys directory (for private/public keys)
      - server-keys:/config/keys
      
      ## Mount SSL certificates directory (optional)
      - server-ssl:/config/ssl
      
      ## Mount Docker socket (required for container management)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
      ## Mount /proc (required for system stats)
      - /proc:/proc:ro
      
      ## Mount root directory
      ## This must match PERIPHERY_ROOT_DIRECTORY inside and outside container
      - ${PERIPHERY_ROOT_DIRECTORY:-./komodo-root}:/etc/komodo
    
    networks:
      - komodo-network
    
    ## Health check
    healthcheck:
      test: ["CMD", "periphery", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  komodo-network:
    driver: bridge
    name: komodo-network

volumes:
  ## Client volumes
  client-config:
    name: komodo-client-config
  client-backups:
    name: komodo-client-backups
  
  ## Server volumes
  server-config:
    name: komodo-server-config
  server-keys:
    name: komodo-server-keys
  server-ssl:
    name: komodo-server-ssl

